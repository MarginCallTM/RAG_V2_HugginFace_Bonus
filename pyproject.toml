[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "RAG system answering questions about the vLLM codebase"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "fire>=0.7",
    "tqdm>=4.66",
    "rank-bm25>=0.2.2",
    "transformers>=4.51,<5",
    "jinja2>=3.1.6",
    "torch>=2.6,<3",
]

[dependency-groups]
dev = [
    "flake8>=7",
    "mypy>=1",
    "pytest>=8",
]

[tool.mypy]
exclude = '^(data|\.venv)/'

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker= "sys_platform == 'linux' or sys_platform == 'win32'" }
